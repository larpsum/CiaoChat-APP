name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build CiaoChat client executable
        run: python -m PyInstaller CiaoChat-Client.spec --clean --noconfirm

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" CiaoChat-Client.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CiaoChat-Client-Windows
          path: |
            dist/CiaoChat.exe
            dist/CiaoChat-Client-Setup.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CiaoChat.exe
            dist/CiaoChat-Client-Setup.exe
